<polyline points="1335,741 1335,775" fill="none" stroke="#087F8C" stroke-width="3"/>
<polygon points="1335.0,775.0 1329.0,763.5 1341.0,763.5" fill="#087F8C"/>
<rect x="975" y="780" width="720" height="155" rx="18" fill="#ECF8F6" stroke="#087F8C" stroke-width="2"/>
<text x="997.0" y="798" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#087F8C">DetokenizerManager</text>
<text x="997.0" y="841" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">将生成的 token 转成文本</text>
<text x="997.0" y="876" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">回传 TokenizerManager，再由 HTTP 流式返回</text>
<text x="1005.0" y="965" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#15253F">GPU：模型权重 + KV 张量 + 工作区</text>
<text x="1005.0" y="1015" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">调度与模型 Worker 在常规路径中紧密协作</text>
<rect x="60" y="1145" width="1680" height="85" rx="18" fill="#EAF0F8" stroke="#EAF0F8" stroke-width="2"/>
<text x="88.0" y="1169" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#15253F">两者都包含：服务入口 → 调度与缓存管理 → 模型执行 → 输出处理；多卡与分离式部署会扩展拓扑。</text>
