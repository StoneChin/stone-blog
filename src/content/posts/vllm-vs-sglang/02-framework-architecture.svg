<text x="66.0" y="110" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#53647B">简化的常规 GPU 在线服务路径；方框表示逻辑组件，并非全部一一对应独立进程</text>
