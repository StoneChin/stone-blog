<text x="1085.0" y="400" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#087F8C">重复至停止条件</text>
<rect x="65" y="380" width="810" height="75" rx="18" fill="#EAF0FC" stroke="#EAF0FC" stroke-width="2"/>
<text x="88.0" y="402" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#2563EB">TTFT：从发出请求到收到首个 token 的等待时间</text>
<text x="66.0" y="515" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#15253F">连续批处理：每轮重新组织正在运行的请求</text>
<text x="369.0" y="580" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#53647B">调度轮次 1</text>
