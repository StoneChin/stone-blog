<text x="67.0" y="897" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#53647B">A 完成后即可接纳 C，无须等待 B 结束。批内 token 配额与执行方式由调度器决定。</text>
