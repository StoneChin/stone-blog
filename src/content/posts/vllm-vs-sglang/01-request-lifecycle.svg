<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="980" viewBox="0 0 1720 980"><rect width="100%" height="100%" fill="#F6F8FC"/>
<text x="64.0" y="44" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700" fill="#15253F">01 / 一次请求，两个计算阶段</text>
<text x="66.0" y="110" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#53647B">以自回归文本生成模型为例；示意图不按实际耗时比例绘制</text>
<rect x="65" y="190" width="300" height="145" rx="18" fill="#EFF5FF" stroke="#2563EB" stroke-width="2"/>
<text x="87.0" y="208" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#2563EB">请求准备</text>
<text x="87.0" y="251" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">模板处理 → Tokenize</text>
<text x="87.0" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">排队 → 查询可复用前缀</text>
<rect x="415" y="190" width="460" height="145" rx="18" fill="#EFF5FF" stroke="#2563EB" stroke-width="2"/>
<text x="437.0" y="208" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#2563EB">Prefill：处理输入</text>
<text x="437.0" y="251" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">计算未命中的输入 token</text>
<text x="437.0" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">建立 KV Cache，随后采样首个 token</text>
<rect x="925" y="190" width="460" height="145" rx="18" fill="#EBF8F6" stroke="#087F8C" stroke-width="2"/>
<text x="947.0" y="208" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#087F8C">Decode：迭代生成</text>
<text x="947.0" y="251" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">读取已有 KV，处理新增 token</text>
<text x="947.0" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">更新 KV，采样后续 token</text>
<rect x="1430" y="190" width="225" height="145" rx="18" fill="#F2EEFB" stroke="#7855C5" stroke-width="2"/>
<text x="1452.0" y="208" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#7855C5">响应</text>
<text x="1452.0" y="251" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">流式返回</text>
<text x="1452.0" y="286" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#53647B">完成或停止</text>
