<rect x="1255" y="704" width="245" height="53" rx="12" fill="#E8F6F4" stroke="#E8F6F4" stroke-width="2"/>
<text x="1353.0" y="716" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" fill="#087F8C">生成</text>
<text x="90.0" y="789" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#7855C5">请求 C</text>
<rect x="310" y="776" width="245" height="53" rx="12" fill="#EFF2F7" stroke="#EFF2F7" stroke-width="2"/>
